services:
  # База данных PostgreSQL
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: bizapp
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    networks:
      - backend

  # Кэш Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - backend

  # FastAPI приложение
  api:
    build: ./api
    ports:
      - "8001:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env
    networks:
      - backend
    volumes:
      - ./api:/app
      - ./.env:/app/.env
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Django приложение
  web:
    build: ./web
    ports:
      - "8081:8080"
    depends_on:
      - db
      - redis
    env_file:
      - .env
    networks:
      - backend
    volumes:
      - ./web:/app
      - ./.env:/app/.env
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8080"

  # Vue.js фронтенд
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    networks:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8001
    depends_on:
      - api

  # Celery worker — выполняет фоновые задачи
  celery-worker:
    build: ./api
    depends_on:
      - db
      - redis
    env_file:
      - .env
    networks:
      - backend
    volumes:
      - ./api:/app
      - ./.env:/app/.env
    command: celery -A celery_app worker --loglevel=info --concurrency=2

  # Celery beat — планировщик (каждые 2ч + 18:00)
  celery-beat:
    build: ./api
    depends_on:
      - db
      - redis
      - celery-worker
    env_file:
      - .env
    networks:
      - backend
    volumes:
      - ./api:/app
      - ./.env:/app/.env
    command: celery -A celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  # pgAdmin для графического управления БД
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    networks:
      - backend
    depends_on:
      - db

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge