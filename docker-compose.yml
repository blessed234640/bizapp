version: '3.8'

services:
  # База данных PostgreSQL
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: bizapp
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  # Кэш Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - backend

  # FastAPI приложение
  api:
    build: ./api
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/bizapp
      - REDIS_URL=redis://redis:6379
    networks:
      - backend
    volumes:
      - ./api:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Django приложение
  web:
    build: ./web
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/bizapp
      - REDIS_URL=redis://redis:6379
    networks:
      - backend
    volumes:
      - ./web:/app
    command: python manage.py runserver 0.0.0.0:8080

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge